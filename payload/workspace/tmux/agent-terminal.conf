# One temporary pane for an agent launched from an ordinary Ghostty shell.
# This server is private to that invocation; X/exit closes it permanently.
set -g prefix None
unbind C-b
set -g status off
set -g default-terminal tmux-256color
set -s terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title:RGB:extkeys:hyperlinks,screen*:title,rxvt*:ignorefkeys'
set -s extended-keys on

# Codex asks for the kitty keyboard protocol, which tmux does not offer, and turns
# xterm extended keys off, so tmux would hand it Shift+Enter as plain Enter (submit).
# Give Codex the CSI-u Shift+Enter it understands; every other program is unchanged.
bind -n S-Enter if -F '#{||:#{==:#{pane_current_command},codex},#{m:*exit-status */codex*,#{pane_start_command}}}' 'send-keys -H 1b 5b 31 33 3b 32 75' 'send-keys S-Enter'
set -sg escape-time 10
set -s set-clipboard on
set -s copy-command 'wl-copy'
set -g allow-passthrough on
set -g focus-events on
set -g mouse on
set -g destroy-unattached on
set -g history-limit 50000
set -g set-titles on
# "Claude — ~/Project — Working" once workspace-control sees the agent's state.
set -g set-titles-string '#{?#{@workspace_title},#{@workspace_title},#{pane_title}}'
set -g menu-style 'bg=#000000,fg=#ffffff'
set -g menu-selected-style 'bg=#3f3f3f,fg=#ffffff'
set -g menu-border-style 'fg=brightblack'
set -g menu-border-lines rounded
bind -T copy-mode WheelUpPane send-keys -X -N 1 scroll-up
bind -T copy-mode WheelDownPane send-keys -X -N 1 scroll-down
bind -T copy-mode-vi WheelUpPane send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 1 scroll-down
bind -n MouseDown3Pane display-menu -O -t= -x M -y M -T ' Agent ' \
    'Paste' p "run-shell -b 'WORKSPACE_TMUX_SOCKET=#{q:socket_path} $HOME/.local/bin/workspace-control action #{pane_id} paste'" \
    'Copy everything' e "run-shell -b 'WORKSPACE_TMUX_SOCKET=#{q:socket_path} $HOME/.local/bin/workspace-control action #{pane_id} copy-all'" \
    'Select visible terminal text' c 'copy-mode' \
    'Read visible screen in Text Editor' r "run-shell -b 'WORKSPACE_TMUX_SOCKET=#{q:socket_path} $HOME/.local/bin/workspace-control action #{pane_id} output'" \
    '' \
    'Close agent' q "display-menu -O -M -x M -y M -T ' Close this agent? ' 'Yes, close it' y 'kill-session' 'No' n ''"
