# Settings for the `work` workspace (Agent 1 | Agent 2; Directory on demand). Used only by
# `work`, which runs tmux on its own socket, so nothing else is affected.
# Everything is driven by the mouse: click to focus, drag borders to resize,
# right-click for the menu.

# --- No keyboard prefix: every key goes straight to Claude / Codex ----------
set -g prefix None
unbind C-b

# --- Terminal features Claude Code and yazi need ---------------------------
set -g default-terminal "tmux-256color"
# Assign instead of append so reloading does not accumulate duplicates.
set -s terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title:RGB:extkeys:hyperlinks,screen*:title,rxvt*:ignorefkeys'
set -s extended-keys on

# Codex asks for the kitty keyboard protocol, which tmux does not offer, and turns
# xterm extended keys off, so tmux would hand it Shift+Enter as plain Enter (submit).
# Give Codex the CSI-u Shift+Enter it understands; every other program is unchanged.
bind -n S-Enter if -F '#{||:#{==:#{pane_current_command},codex},#{m:*exit-status */codex*,#{pane_start_command}}}' 'send-keys -H 1b 5b 31 33 3b 32 75' 'send-keys S-Enter'
# Passthrough lets Claude's notifications reach Ghostty. It's off by default and
# turned on per agent pane: tmux hands Ghostty's replies to the *focused* pane,
# so the Directory browser's startup queries would otherwise be typed into Agent 1.
set -g allow-passthrough off
set -g update-environment 'DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY WAYLAND_DISPLAY XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS TERM TERM_PROGRAM'
set -s set-clipboard on
set -s copy-command 'wl-copy'
set -g focus-events on
set -sg escape-time 10
set -g history-limit 50000

# Detached sessions stay alive while the launcher builds or restores panes.
# Once opened, X/Quit stops them. Park is an explicit action that turns this off.
set -g destroy-unattached off
# Opening a window with just the two agents shares the width evenly; a resized window can drift.
set-hook -g client-attached 'set-option destroy-unattached on ; if -F "#{==:#{window_panes},2}" "select-layout -E"'
set-hook -g client-session-changed 'set-option destroy-unattached on'

# Ghostty title: workspace number, its folder, then each agent/terminal pane's
# state left to right, e.g. "Workspace 1 — ~/Project — Working/Finished".
# workspace-control keeps @workspace_title current; agents' own pane titles and
# Directory focus never change it. The fallback covers the moment before.
set -g set-titles on
set -g set-titles-string '#{?#{@workspace_title},#{@workspace_title},#{?#{@workspace_label},#{@workspace_label},Workspace} — #{session_path}}'

# --- Look: nothing static at the bottom of the OLED; names on the borders ---
set -g status off
set -g pane-border-status top
set -g pane-border-lines single
# Pane labels, all bold: a pair's role in its colour (orchestrator purple, coder light coral),
# then the name in white, then the state: working blue, finished green, needs you red, ready grey,
# stopped dark grey. The active pane has a white border line; blue only ever means working.
set -g pane-border-style 'fg=#2f2f2f'
set -g pane-active-border-style 'fg=#e4e4e4'
set -g pane-border-format ' #[bold,fg=#e4e4e4]#{?#{@role_label},#{?#{==:#{@role_label},Orchestrator},#[fg=#cba6f7],#[fg=#ffa891]}#{@role_label}#[fg=#e4e4e4] · ,}#{?#{@name},#{@name},#{pane_current_command}}#{?#{@workspace_status}, — #{?#{m/r:^(Working|Starting|Round ),#{@workspace_status}},#[fg=#89b4fa],#{?#{==:#{@workspace_status},Finished},#[fg=#a6e3a1],#{?#{m/r:^(Needs input|Error)$,#{@workspace_status}},#[fg=#ff5555],#{?#{==:#{@workspace_status},Stopped},#[fg=#6c7086],#[fg=#9698a8]}}}}#{s/Needs input/Needs you/:@workspace_status},}#[default] '
set -g menu-style 'bg=#000000,fg=#ffffff'
set -g menu-selected-style 'bg=#3f3f3f,fg=#ffffff'
set -g menu-border-style 'fg=brightblack'
set -g menu-border-lines rounded

# --- Mouse --------------------------------------------------------------------
set -g mouse on
# Keep file paths whole when double-clicking or opening them.
set -g word-separators " \"'()[]{}<>,;|`"
# One line per wheel event in terminal history (the default is five).
bind -T copy-mode WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
# Selecting text in a plain shell pane copies it to the clipboard.
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# Right-click menu (replaces the Ghostty menu inside the workspace).
bind -n MouseDown3Pane select-pane -t= \; display-menu -O -t= -x M -y M -T "#[align=centre] #{?#{@name},#{@name},pane} " \
	"#{?#{m/r:[/.][^ ]*[A-Za-z0-9],#{mouse_word}},Open #{=/-32/…:mouse_word},-Open (right-click a file path)}" o "set -p @clicked #{q:mouse_word} ; run-shell -b '$HOME/.local/bin/open-path #{pane_id}'" \
	"Paste" p "run-shell -b '$HOME/.local/bin/workspace-control action #{pane_id} paste'" \
	"Copy everything" e "run-shell -b '$HOME/.local/bin/workspace-control action #{pane_id} copy-all'" \
	"" \
	"Agents…" a "run-shell -b '$HOME/.local/bin/workspace-control action #{pane_id} agents-menu'" \
	"#{?#{@pair_dir},Pair controls…,Pair two agents…}" g "run-shell -b '$HOME/.local/bin/agent-pair action #{pane_id}'" \
	"Project / review…" j "run-shell -b '$HOME/.local/bin/workspace-control action #{pane_id} project-menu'" \
	"Layout / output / resources…" v "run-shell -b '$HOME/.local/bin/workspace-control action #{pane_id} view-menu'" \
	"Open / reopen a project…" w "run-shell -b '$HOME/.local/bin/workspace-control action #{pane_id} projects'" \
	"Close workspace (stop agents)" q "display-menu -O -M -x M -y M -T '#[align=centre] Close everything? ' 'Yes, close the workspace' y 'kill-session' 'No' n ''" \
	"Park workspace" k "run-shell -b '$HOME/.local/bin/workspace-control action #{pane_id} park'" \
	"Save workspace layouts" s "run-shell -b '$HOME/.local/bin/workspace-control action #{pane_id} save'" \
	"" \
	"Split right" r "run-shell -b '$HOME/.local/bin/workspace-control action #{pane_id} split-right'" \
	"Split down" d "run-shell -b '$HOME/.local/bin/workspace-control action #{pane_id} split-down'" \
	"Show Directory" f "run-shell -b '$HOME/.local/bin/workspace-control action #{pane_id} directory'" \
	"#{?window_zoomed_flag,Restore size,Enlarge to full window}" z "resize-pane -Z" \
	"" \
	"Close this pane" x "display-menu -O -M -x M -y M -T '#[align=centre] Close #{?#{@name},#{@name},this pane}? ' 'Yes, close it' y 'kill-pane' 'No' n ''"

# Recover layouts without blindly rerunning agent processes after a reboot.
set -g @resurrect-dir '@HOME@/.local/state/workspace/resurrect'
set -g @resurrect-processes 'false'
set -g @resurrect-capture-pane-contents 'on'
