kind = "merge"
strategy = "claude-settings"
source = "payload/agents/claude-settings.json"
render = true
target = ".claude/settings.json"
live = false

[[file]]
component = "agents"
kind = "merge"
strategy = "codex-config"
source = "payload/agents/codex-config.json"
target = ".codex/config.toml"
live = false

# Claude Code can register this handler itself; never replace an existing one.
[[file]]
component = "agents"
kind = "seed"
source = "payload/agents/applications/claude-code-url-handler.desktop"
target = ".local/share/applications/claude-code-url-handler.desktop"
render = true
sanitize = [["\"@HOME@/.local/bin/claude\"", "\"@CLAUDE_BIN@\""]]

[[file]]
component = "agents"
kind = "merge"
strategy = "mimeapps"
source = "payload/agents/mime-defaults.json"
target = ".config/mimeapps.list"
live = false

# --- memory ------------------------------------------------------------------

[[file]]
component = "memory"
source = "payload/memory/bin/ai-memory"
target = ".local/bin/ai-memory"
mode = "755"

[[file]]
component = "memory"
source = "payload/memory/systemd/ai-memory-snapshot.service"
target = ".config/systemd/user/ai-memory-snapshot.service"

[[file]]
component = "memory"
source = "payload/memory/systemd/ai-memory-snapshot.timer"
target = ".config/systemd/user/ai-memory-snapshot.timer"

# The shared memory starts empty. An existing ~/ai-memory is never replaced.
[[file]]
component = "memory"
kind = "seed"
source = "templates/memory/MEMORY.md"
target = "ai-memory/MEMORY.md"
live = false

[[file]]
component = "memory"
kind = "dir"
target = "ai-memory/projects"

[[file]]
component = "memory"
kind = "merge"
strategy = "claude-import"
source = "templates/memory/CLAUDE.md"
target = ".claude/CLAUDE.md"
live = false

# Codex reads the same rules through its global AGENTS.md.
[[file]]
component = "memory"
kind = "link"
target = ".codex/AGENTS.md"
link = "../ai-memory/MEMORY.md"

[[file]]
component = "memory"
kind = "merge"
strategy = "git-ignore"
source = "payload/memory/git-ignore"
target = ".config/git/ignore"
live = false

