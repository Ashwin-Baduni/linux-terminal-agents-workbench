# Every file this repository installs, and where it goes.
#
# Paths:
#   source  repository path
#   target  destination, relative to the target home
#   live    where scripts/import-live.py reads the file on a machine that already
#           runs the setup (relative to that home; defaults to target; false = the
#           repository copy is the only source)
#
# Kinds (default "file"):
#   file    install the source at target, backing up whatever was there
#   seed    install only when target does not exist yet; never overwrite
#   link    create a symlink at target pointing to `link` (always relative)
#   dir     create the directory target
#   merge   combine source into an existing target with `strategy`, keeping
#           everything else in that file (implemented by the installer)
#
# Other fields:
#   component  which component installs it (see components.toml)
#   mode       octal permission bits; default 644
#   render     replace @PLACEHOLDER@ tokens (see [placeholders]) at install time
#   sanitize   [[old, new], ...] replacements import-live applies after turning the
#              live home path into @HOME@. Never list private names here: this file
#              is public. Files the repository changed on purpose simply show up as
#              differences in import-live until the live machine is reinstalled.
#
# [[tree]] maps a whole vendored directory; `include` lists the files (globs)
# shipped from it, and `mode` overrides the permission bits of every file.

format = 1

[placeholders]
HOME = "absolute path of the target home"
CLAUDE_BIN = "the target user's claude executable"

